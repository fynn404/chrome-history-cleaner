<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>History Cleaner & Stats</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>History Cleaner & Stats</h2>

        <div class="section">
            <h3>Clean History</h3>
            <div class="time-range">
                <label>Time Range:</label>
                <select id="timeRange">
                    <option value="hour">Last Hour</option>
                    <option value="day">Last Day</option>
                    <option value="week">Last Week</option>
                    <option value="month">Last Month</option>
                    <option value="custom">Custom Range</option>
                </select>
            </div>

            <div id="customRange" style="display: none;">
                <label>From:</label>
                <input type="datetime-local" id="startTime">
                <label>To:</label>
                <input type="datetime-local" id="endTime">
            </div>

            <div class="domain-filter">
                <label>Domain Filter (optional):</label>
                <input type="text" id="domainFilter" placeholder="e.g., google.com">
            </div>

            <button id="cleanHistory">Clean History</button>
        </div>

        <div class="section">
            <h3>Domain Statistics</h3>
            <div class="stats-controls">
                <select id="statsTimeRange">
                    <option value="day">Last 24 Hours</option>
                    <option value="week">Last Week</option>
                    <option value="month">Last Month</option>
                </select>
                <button id="refreshStats">Refresh Stats</button>
            </div>
            <div id="statsContainer">
                <!-- Statistics will be inserted here -->
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>

</html>
